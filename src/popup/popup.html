<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Declutter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <span class="popup__logo" aria-hidden="true">&#10005;</span>
        <h1 class="popup__title">Declutter</h1>
      </header>

      <p class="popup__hostname" id="hostname">loading&hellip;</p>
      <p class="popup__status" id="status">0 active rules</p>

      <div class="popup__actions">
        <button id="cleanPage" class="btn btn--secondary" type="button">
          Clean this page
        </button>
        <button id="editLayout" class="btn btn--primary" type="button">
          Edit layout
        </button>
        <button id="restorePage" class="btn btn--danger" type="button">
          Restore page
        </button>
      </div>

      <p class="popup__hint" id="hint"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
